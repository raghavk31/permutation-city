[project]
name = "permutation-city"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fabdem>=0.2.2",
    "folium>=0.20.0",
    "geopandas>=1.2.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "overturemaps>=1.0.2",
    "pyarrow>=26.0.0",
    "pyyaml>=6.0.3",
    "rasterio>=1.4.4",
    "shapely>=2.2.0",
    "streamlit>=1.66.0",
    "streamlit-folium>=0.27.4",
]

[project.scripts]
pc = "pc.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pc"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
