# Permutation City: the McHarg rules
#
# What the land allows, cell by cell. Every hex ends up in one state:
#
#   forbidden    nature's: water, deep flooding, the harbour edge. Never built on.
#   retained     the existing city kept as it is (Sem 06's "retained areas"). Context only.
#   constrained  buildable, but with limits (heights, permeable ground, uses).
#   open         the genes decide.
#
# Forbidden beats retained, and retained beats constrained. A cell can match several
# constrained rules: their limits combine, and the strictest one wins.
#
# `when` is a test on the layer columns (see pc/layers.py), e.g. `flood_surge_2050 > 1.5`.
# Change a number, run `uv run pc rules mumbai-ewf`, and see the map change.

defaults:
  max_levels: 15         # Eco-machine height range: 0 to 15 levels
  min_permeable: 0.2     # share of ground that must stay unsealed
  uses: [water, wetland, landscape, building, street]

forbidden:
  - name: harbour water
    when: water

  - name: deep flooding in 2050
    when: flood_surge_2050 > 1.5
    why: more than 1.5 m of water in a 2050 monsoon surge; give it back to the sea

  - name: harbour edge
    when: edge_dist < 30
    why: a continuous public edge and room for wetland and mangrove

retained:
  - name: old city
    when: not in_design and not industrial
    why: west of P D'Mello Road is the old city (Dongri, Bhendi Bazaar); context, not design
      ground. The rail yards there stay designable through the industrial rule.

constrained:
  - name: shallow flooding in 2050
    when: flood_surge_2050 > 0
    why: floods up to 1.5 m in a 2050 surge
    limits: {raised_ground: true, min_permeable: 0.5}

  - name: rain hollows
    when: pool > 0.2
    why: rainwater collects here; keep it as storage
    limits: {min_permeable: 0.7, uses: [water, wetland, landscape]}

  - name: drainage lines
    when: upstream >= 40
    why: water flows through here; keep the path open
    limits: {min_permeable: 0.5, uses: [water, wetland, landscape, street]}

  - name: sea-breeze edge
    when: edge_dist < 120
    why: keep low near the water so the sea breeze reaches inland (Eco-machine heights)
    limits: {max_levels: 4}

  - name: industrial land
    when: industrial
    why: likely contaminated; clean-up comes before building
    limits: {remediate: true}

  - name: existing trees
    when: trees >= 0.5
    why: mature canopy; build around it
    limits: {min_permeable: 0.6, max_levels: 6}
